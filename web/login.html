<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Studio 登录</title>
<style>
  :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5efe5; color: #24201b; }
  main { width: min(420px, calc(100vw - 32px)); padding: 36px; border: 1px solid #dccfbe; border-radius: 22px; background: rgba(255,255,255,.84); box-shadow: 0 24px 70px rgba(72,50,28,.12); }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 26px; color: #7a6e60; }
  label { display: block; margin: 14px 0 6px; font-size: 14px; color: #655a4e; }
  input { width: 100%; border: 1px solid #d8c9b7; border-radius: 12px; padding: 12px 14px; font: inherit; background: #fffdf9; }
  button { width: 100%; margin-top: 22px; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; color: white; background: #df7c50; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  #error { min-height: 20px; margin-top: 12px; color: #b54236; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>AI Studio</h1>
  <p>使用你的公司账号登录</p>
  <form id="loginForm">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button id="submit" type="submit">登录</button>
    <div id="error" role="alert"></div>
  </form>
</main>
<script>
const form = document.getElementById('loginForm')
form.addEventListener('submit', async (event) => {
  event.preventDefault()
  const submit = document.getElementById('submit')
  const error = document.getElementById('error')
  submit.disabled = true
  error.textContent = ''
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.username.value, password: form.password.value }),
    })
    const data = await response.json()
    if (!response.ok) throw new Error(data.error || '登录失败')
    const next = new URLSearchParams(location.search).get('next')
    location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/web/workgroup-v2/index.html')
  } catch (cause) {
    error.textContent = cause instanceof Error ? cause.message : '登录失败'
  } finally {
    submit.disabled = false
  }
})
</script>
</body>
</html>
